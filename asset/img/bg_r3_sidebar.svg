<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <!-- Vòng tròn quỹ đạo ngoài nét đứt -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,8" />
    <circle cx="250" cy="250" r="180" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3,6" />
    
    <!-- Các quỹ đạo nguyên tử khoa học xoay góc -->
    <ellipse cx="250" cy="250" rx="210" ry="75" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(30 250 250)" />
    <ellipse cx="250" cy="250" rx="210" ry="75" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(-30 250 250)" />
    <ellipse cx="250" cy="250" rx="210" ry="75" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(90 250 250)" />
    
    <!-- Tâm hạt nhân phát sáng -->
    <circle cx="250" cy="250" r="24" fill="#6ee7b7" opacity="0.3" />
    <circle cx="250" cy="250" r="10" fill="#ffffff" />
    
    <!-- Họa tiết đa giác cấu trúc mạng lưới liên kết -->
    <polygon points="250,70 280,180 390,180 300,240 335,350 250,285 165,350 200,240 110,180 220,180" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="4,5" />
</svg>